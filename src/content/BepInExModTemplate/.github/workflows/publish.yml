name: Publish

on:
  push:
    tags: ["*[0-9]+.[0-9]+.[0-9]+", "*[0-9]+.[0-9]+.[0-9]+-*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: |
          dotnet restore --locked-mode
          dotnet tool restore

      - name: Publish to Thunderstore
        env:
          ThunderstoreToken: ${{ secrets.THUNDERSTORE_API_TOKEN }}
        run: dotnet pack -c Release -p:PublishTS=true
#if (library)

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/package/release/*.nupkg --skip-duplicate --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
#endif
